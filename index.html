<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GLORY Sportswear — 2026 Catalogue</title>
<meta name="description" content="GLORY 2026 sportswear catalogue — football, basketball, handball, volleyball & racket teamwear. Order directly on WhatsApp.">
<style>
  :root{
    --ink:#111318;
    --paper:#f4f5f7;
    --card:#ffffff;
    --accent:#e11d2e;
    --green:#25d366;
    --green-dark:#128c4a;
    --muted:#6b7280;
    --line:#e5e7eb;
    --shadow:0 2px 10px rgba(0,0,0,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.5;
  }

  /* ---------- Sticky section nav ---------- */
  nav.sections{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.96);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);box-shadow:0 1px 6px rgba(0,0,0,.05);
    display:flex;gap:.45rem;overflow-x:auto;padding:.55rem .75rem;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  /* Center the bookmark items; when they overflow on small screens the
     auto margins collapse to 0 so the start stays scrollable (no clip). */
  nav.sections::before, nav.sections::after{ content:""; margin:auto; }
  nav.sections::-webkit-scrollbar{display:none}
  nav.sections a{
    flex:0 0 auto;text-decoration:none;color:var(--ink);
    font-size:.78rem;font-weight:600;padding:.42rem .85rem;border-radius:999px;
    background:#eef0f3;border:1px solid transparent;white-space:nowrap;
  }
  nav.sections a:hover{background:#e2e6ec}
  nav.sections a.wa{
    background:var(--green);color:#fff;display:flex;align-items:center;gap:.3rem;
  }

  /* ---------- Sections ---------- */
  main{max-width:840px;margin:0 auto;padding:1rem .75rem 6rem}
  section.sport{margin-top:1.1rem}
  h2.sport-title{
    display:flex;align-items:baseline;gap:.6rem;
    font-size:1.05rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    padding:.45rem .2rem;border-bottom:3px solid var(--accent);margin-bottom:.7rem;
  }
  h2.sport-title .ar{font-size:.85rem;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
  h2.sport-title .count{margin-left:auto;font-size:.72rem;font-weight:600;color:var(--muted)}

  /* ---------- Gallery (fallback mode) ---------- */
  .page{
    position:relative;background:var(--card);border-radius:10px;overflow:hidden;
    box-shadow:var(--shadow);margin-bottom:.9rem;cursor:zoom-in;
  }
  .page img{
    display:block;width:100%;height:auto;aspect-ratio:1/1;
    background:#e8eaee;object-fit:cover;
    transition:transform .25s ease, opacity .3s ease;
  }
  .page img.lq{filter:blur(4px);transform:scale(1.03)}
  .page img.full{filter:none;transform:none}
  .spread{
    position:relative;display:flex;gap:6px;margin-bottom:.9rem;cursor:zoom-in;
    background:var(--card);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);
  }
  .spread img{
    flex:1 1 0;min-width:0;display:block;aspect-ratio:1/1;
    background:#e8eaee;object-fit:cover;
    transition:transform .25s ease, opacity .3s ease;
  }
  .spread img.lq{filter:blur(4px);transform:scale(1.03)}
  .spread img.full{filter:none;transform:none}
  .page .pgno, .spread .pgno{
    position:absolute;right:.5rem;bottom:.5rem;z-index:2;
    background:rgba(0,0,0,.55);color:#fff;font-size:.68rem;font-weight:700;
    padding:.12rem .5rem;border-radius:999px;pointer-events:none;
    font-variant-numeric:tabular-nums;
  }
  .page .tag{
    position:absolute;left:.5rem;top:.5rem;z-index:2;
    background:rgba(229,29,46,.92);color:#fff;font-size:.62rem;font-weight:800;
    text-transform:uppercase;letter-spacing:.06em;padding:.16rem .55rem;border-radius:999px;
    pointer-events:none;
  }

  /* ---------- Flipbook (default mode when StPageFlip loads) ---------- */
  #book-wrap{display:none;padding:.15rem 0 .2rem}
  body.flipbook #book-wrap{display:block}
  body.flipbook #gallery{display:none}
  #book{margin:0 auto}
  .book-hint{text-align:center;color:var(--muted);font-size:.72rem;margin-top:.6rem}
  .my-page{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.14)}
  .my-page img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
  /* StPageFlip core styles (inlined so the book always renders correctly) */
  .stf__parent{position:relative;display:block;box-sizing:border-box;transform:translateZ(0);-ms-touch-action:pan-y;touch-action:pan-y}
  .stf__wrapper{position:relative;width:100%;box-sizing:border-box}
  .stf__parent canvas{position:absolute;width:100%;height:100%;left:0;top:0}
  .stf__block{position:absolute;width:100%;height:100%;box-sizing:border-box;perspective:2000px}
  .stf__item{display:none;position:absolute;transform-style:preserve-3d}
  .stf__outerShadow,.stf__innerShadow,.stf__hardShadow,.stf__hardInnerShadow{position:absolute;left:0;top:0}

  /* ---------- Lightbox ---------- */
  #lightbox{
    position:fixed;inset:0;z-index:100;display:none;
    background:rgba(8,10,14,.97);
  }
  #lightbox.open{display:flex;align-items:center;justify-content:center}
  #lightbox .stage{
    width:100%;height:100%;overflow:auto;overscroll-behavior:contain;
    display:flex;align-items:flex-start;justify-content:center;padding:0;
    -webkit-overflow-scrolling:touch;
  }
  #lightbox .wrap{
    display:flex;gap:6px;align-items:flex-start;justify-content:center;
  }
  #lightbox img{
    display:block;max-width:none;width:auto;height:auto;
    transform-origin:0 0;user-select:none;-webkit-user-drag:none;
  }
  #lightbox .close{
    position:fixed;top:calc(.7rem + env(safe-area-inset-top));right:.9rem;z-index:101;
    width:2.6rem;height:2.6rem;border-radius:50%;border:none;cursor:pointer;
    background:rgba(255,255,255,.14);color:#fff;font-size:1.35rem;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  #lightbox .close:hover{background:rgba(255,255,255,.28)}
  #lightbox .cap{
    position:fixed;bottom:calc(.7rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    z-index:101;background:rgba(0,0,0,.6);color:#fff;font-size:.75rem;font-weight:600;
    padding:.3rem .9rem;border-radius:999px;white-space:nowrap;
  }

  /* ---------- Floating WhatsApp ---------- */
  a.wa-fab{
    position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom));z-index:60;
    display:flex;align-items:center;gap:.55rem;
    background:var(--green);color:#fff;text-decoration:none;
    padding:.8rem 1.1rem .8rem .85rem;border-radius:999px;
    box-shadow:0 6px 22px rgba(18,140,74,.45);
    font-weight:700;font-size:.9rem;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  a.wa-fab:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(18,140,74,.55)}
  a.wa-fab svg{width:1.55rem;height:1.55rem;flex:0 0 auto}
  a.wa-fab .txt{line-height:1.1}
  a.wa-fab .txt small{display:block;font-weight:600;font-size:.62rem;opacity:.85;letter-spacing:.03em}

  footer{
    text-align:center;padding:1.2rem 1rem 1.6rem;color:var(--muted);font-size:.75rem;
    border-top:1px solid var(--line);
  }
  footer b{color:var(--ink)}
  @media (max-width:420px){ a.wa-fab .txt small{display:none} }
</style>
</head>
<body>

<nav class="sections" id="nav">
  <a href="#s-football">Football</a>
  <a href="#s-basketball">Basketball</a>
  <a href="#s-handball">Handball</a>
  <a href="#s-volleyball">Volleyball</a>
  <a href="#s-racket">Racket</a>
  <a class="wa" href="https://wa.me/201064128434?text=Hello%20GLORY%21%20I%20want%20to%20order%20from%20the%202026%20catalogue." target="_blank" rel="noopener">Order Now</a>
</nav>

<main>
  <div id="book-wrap">
    <div id="book" role="application" aria-label="GLORY 2026 catalogue flipbook"></div>
    <p class="book-hint">Tap / drag to flip · Use ← → keys · Section buttons jump to the right spread</p>
  </div>
  <div id="gallery"></div>
</main>

<footer>
  <b>GLORY Sportswear</b> — 2026 Catalogue · All designs © GLORY<br>
  Order directly: <a href="https://wa.me/201064128434" target="_blank" rel="noopener">WhatsApp +20 106 412 8434</a>
</footer>

<!-- Lightbox -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Page zoom">
  <button class="close" id="lbClose" aria-label="Close">✕</button>
  <div class="stage" id="lbStage"><div class="wrap" id="lbWrap"></div></div>
  <div class="cap" id="lbCap"></div>
</div>

<a class="wa-fab" href="https://wa.me/201064128434?text=Hello%20GLORY%21%20I%20want%20to%20order%20from%20the%202026%20catalogue." target="_blank" rel="noopener" aria-label="Order on WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.96L2 22l5.18-1.5A9.94 9.94 0 1 0 12.04 2zm5.8 14.08c-.24.68-1.4 1.3-1.94 1.34-.52.05-1.01.24-3.4-.7-2.88-1.14-4.7-4.08-4.85-4.27-.14-.19-1.16-1.55-1.16-2.96 0-1.4.73-2.09 1-2.38.26-.28.57-.35.76-.35h.55c.17 0 .41-.07.64.5.24.57.8 1.97.87 2.11.07.14.12.31.02.5-.09.19-.14.3-.28.47-.14.16-.3.37-.42.5-.14.14-.29.3-.13.58.16.28.73 1.2 1.56 1.95 1.07.96 1.97 1.26 2.25 1.4.28.14.45.12.61-.07.17-.19.7-.82.9-1.1.19-.28.38-.23.64-.14.26.09 1.66.78 1.94.93.28.14.47.21.54.33.07.12.07.7-.16 1.42z"/></svg>
  <span class="txt">Order Now<small>اطلب الآن</small></span>
</a>

<script>
(function(){
  // Sections from the PDF TOC (1-based page numbers)
  var SECTIONS = [
    {id:"s-cover",     name:"Cover",      ar:"الغلاف",     first:1,  last:3},
    {id:"s-football",  name:"Football",   ar:"كرة القدم",   first:4,  last:15},
    {id:"s-basketball",name:"Basketball", ar:"كرة السلة",   first:16, last:27},
    {id:"s-handball",  name:"Handball",   ar:"كرة اليد",    first:28, last:39},
    {id:"s-volleyball",name:"Volleyball", ar:"الكرة الطائرة",first:40, last:51},
    {id:"s-racket",    name:"Racket",     ar:"مضرب",        first:52, last:63},
    {id:"s-back",      name:"Back Cover", ar:"الغلاف الخلفي",first:64, last:65}
  ];

  var gallery = document.getElementById("gallery");
  var html = "";
  SECTIONS.forEach(function(sec){
    // GLOBAL consecutive pairing starting at page 2: page 1 is the only single
    // page (front cover); every other page pairs as (2,3), (4,5), (6,7), ...
    // up to (64,65). All sport sections start on even pages and have even page
    // counts, so no pair ever straddles a section boundary — the section
    // headers stay intact and the pairing flows continuously.
    var items = [];
    var p = sec.first;
    while (p <= sec.last){
      if (p === 1){
        items.push({first:1, last:1, isSpread:false});
        p = 2;
      } else {
        items.push({first:p, last:Math.min(p + 1, sec.last), isSpread:true});
        p += 2;
      }
    }
    var spreads = 0, singles = 0;
    items.forEach(function(it){ if (it.isSpread) spreads++; else singles++; });
    var countText = (spreads ? spreads + (spreads > 1 ? " spreads" : " spread") : "")
                  + (singles ? (spreads ? " + " : "") + singles + (singles > 1 ? " pages" : " page") : "");
    html += '<section class="sport" id="' + sec.id + '">' +
            '<h2 class="sport-title">' + sec.name + ' <span class="ar">' + sec.ar + '</span>' +
            '<span class="count">' + countText + '</span></h2>';
    items.forEach(function(it){
      if (!it.isSpread){
        var n = ("00" + it.first).slice(-3);
        html += '<figure class="page" data-page="' + it.first + '">' +
                '<img data-src="images/page-' + n + '.jpg" alt="GLORY 2026 catalogue page ' + it.first + ' — ' + sec.name + '" ' +
                     'loading="lazy" decoding="async">' +
                '<span class="pgno">' + it.first + '</span></figure>';
      } else {
        var n1 = ("00" + it.first).slice(-3), n2 = ("00" + it.last).slice(-3);
        html += '<figure class="spread" data-pages="' + it.first + ',' + it.last + '">' +
                '<img data-src="images/page-' + n1 + '.jpg" alt="GLORY 2026 catalogue page ' + it.first + ' — ' + sec.name + '" loading="lazy" decoding="async">' +
                '<img data-src="images/page-' + n2 + '.jpg" alt="GLORY 2026 catalogue page ' + it.last + ' — ' + sec.name + '" loading="lazy" decoding="async">' +
                '<span class="pgno">' + it.first + '-' + it.last + '</span></figure>';
      }
    });
    html += '</section>';
  });
  gallery.innerHTML = html;

  // Lazy fade-in + low-quality placeholder trick (fallback gallery mode)
  var io = "IntersectionObserver" in window
    ? new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if (en.isIntersecting){
            var img = en.target;
            img.classList.add("lq");
            img.src = img.getAttribute("data-src");
            img.onload = function(){
              img.classList.remove("lq");
              img.classList.add("full");
              io.unobserve(img);
            };
            img.onerror = function(){ img.classList.remove("lq"); io.unobserve(img); };
          }
        });
      }, {rootMargin:"300px 0px"})
    : null;

  var imgs = gallery.querySelectorAll("img[data-src]");
  Array.prototype.forEach.call(imgs, function(img){
    if (io) io.observe(img);
    else { img.src = img.getAttribute("data-src"); }
  });

  /* ---------- Lightbox tap-to-zoom (single pages and 2-page spreads) ---------- */
  var lb = document.getElementById("lightbox");
  var lbWrap = document.getElementById("lbWrap");
  var lbStage = document.getElementById("lbStage");
  var lbCap = document.getElementById("lbCap");
  var scale = 1;
  var dbl = false;
  var lbImgs = [];

  function fitLB(){
    var vw = lbStage.clientWidth;
    var gap = lbImgs.length > 1 ? 6 : 0;
    var per = lbImgs.length > 1 ? Math.floor((vw - gap) / 2) : vw;
    lbImgs.forEach(function(img){
      var nw = img.naturalWidth, nh = img.naturalHeight;
      var w = Math.min(nw, per);
      if (lbImgs.length === 1 && nw < vw && nh < lbStage.clientHeight) w = nw;
      img.style.width = w + "px";
    });
  }

  function openLB(items, cap){
    lbWrap.innerHTML = "";
    lbImgs = [];
    items.forEach(function(it){
      var img = document.createElement("img");
      img.src = it.src;
      img.alt = it.alt || "";
      lbWrap.appendChild(img);
      lbImgs.push(img);
    });
    lbCap.textContent = cap;
    scale = 1; dbl = false;
    lb.classList.add("open");
    lbStage.scrollTop = 0; lbStage.scrollLeft = 0;
    var pending = lbImgs.length;
    var done = {};
    lbImgs.forEach(function(img){
      var fin = function(){
        if (done[img.src]) return;
        done[img.src] = true;
        pending--;
        if (pending <= 0){ fitLB(); lbImgs.forEach(function(i){ i.onload = null; }); }
      };
      img.onload = fin;
      if (img.complete && img.naturalWidth > 0) fin();
    });
  }
  function closeLB(){ lb.classList.remove("open"); lbWrap.innerHTML = ""; lbImgs = []; }
  function zoomAt(clientX, clientY){
    var rect = lbWrap.getBoundingClientRect();
    var ox = (clientX - rect.left) / rect.width;
    var oy = (clientY - rect.top) / rect.height;
    lbImgs.forEach(function(img){
      img.style.transformOrigin = (ox*100) + "% " + (oy*100) + "%";
      img.style.transform = "scale(" + scale + ")";
    });
  }

  gallery.addEventListener("click", function(e){
    var fig = e.target.closest(".page, .spread");
    if (!fig) return;
    var imgs = fig.querySelectorAll("img");
    var items = [], cap, pages;
    if (fig.classList.contains("spread")){
      pages = fig.getAttribute("data-pages").split(",");
      cap = "Pages " + pages[0] + "-" + pages[1];
    } else {
      pages = [fig.getAttribute("data-page")];
      cap = "Page " + pages[0];
    }
    for (var i = 0; i < imgs.length; i++){
      items.push({ src: imgs[i].currentSrc || imgs[i].src || imgs[i].getAttribute("data-src"),
                   alt: imgs[i].alt });
    }
    openLB(items, cap);
  });

  document.getElementById("lbClose").addEventListener("click", closeLB);
  lb.addEventListener("click", function(e){ if (e.target === lb) closeLB(); });

  // double-tap to toggle 2x zoom (mobile), wheel/ctrl+scroll for desktop
  var lastTap = 0;
  lbStage.addEventListener("touchend", function(e){
    var now = Date.now();
    if (now - lastTap < 320){
      e.preventDefault();
      var t = e.changedTouches[0];
      scale = (scale > 1) ? 1 : 2;
      zoomAt(t.clientX, t.clientY);
      lastTap = 0;
    } else { lastTap = now; }
  }, {passive:false});

  lbStage.addEventListener("dblclick", function(e){
    scale = (scale > 1) ? 1 : 2;
    zoomAt(e.clientX, e.clientY);
  });

  lbStage.addEventListener("wheel", function(e){
    if (!e.ctrlKey) return;
    e.preventDefault();
    scale = Math.min(4, Math.max(1, scale + (e.deltaY < 0 ? 0.25 : -0.25)));
    zoomAt(e.clientX, e.clientY);
  }, {passive:false});

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape") closeLB();
  });

  /* ================= Flipbook mode (StPageFlip) =================
     Progressive enhancement: the scroll/spread gallery above is ALWAYS the
     base. We try to load the flipbook library from a CDN; only when it is
     available do we switch the page to flipbook mode. If the library fails
     to load (offline, blocked CDN, in-app browser), the gallery remains. */
  var BOOK_PAGES = 65;
  var bookWrap = document.getElementById("book-wrap");
  var pfLoaded = false;

  function pfImg(n){
    var img = document.createElement("img");
    img.src = "images/page-" + ("00" + n).slice(-3) + ".jpg";
    img.alt = "GLORY 2026 catalogue page " + n;
    img.width = 1000; img.height = 1000;
    img.draggable = false;
    return img;
  }

  function enableFlipbook(){
    var book = document.getElementById("book");
    // 65 single-faced page elements: element 0 = page 1 (hard cover, shown
    // alone when the book is closed), elements 1..64 = pages 2..65.
    // StPageFlip pairs them as spreads [1,2], [3,4], ... = (2,3), (4,5), ...
    for (var i = 1; i <= BOOK_PAGES; i++){
      var el = document.createElement("div");
      el.className = "my-page";
      if (i === 1 || i === BOOK_PAGES) el.setAttribute("data-density", "hard");
      el.appendChild(pfImg(i));
      book.appendChild(el);
    }
    var pf = new St.PageFlip(book, {
      width: 400, height: 400,           // square base page (1:1)
      size: "stretch",
      minWidth: 130, maxWidth: 520,
      minHeight: 130, maxHeight: 520,
      usePortrait: false,                // always landscape: two pages side by side
      showCover: true,                   // page 1 shows alone as the front cover
      autoSize: true,
      startPage: 0,
      flippingTime: 700,
      maxShadowOpacity: 0.4,
      mobileScrollSupport: true,
      swipeDistance: 30,
      useMouseEvents: true,
      clickEventForward: false,
      disableFlipByClick: false
    });
    pf.loadFromHTML(book.querySelectorAll(".my-page"));
    pfLoaded = true;
    document.body.classList.add("flipbook");

    // Section nav links: jump to the spread that contains the section's first page.
    // Element index of catalog page p is p-1; StPageFlip flips to the spread
    // containing that element (football p=4 -> spread (4,5)).
    document.getElementById("nav").addEventListener("click", function(e){
      var a = e.target.closest("a");
      if (!a || a.classList.contains("wa")) return; // Order button = plain link
      var href = (a.getAttribute("href") || "").slice(1);
      var sec = null;
      for (var i = 0; i < SECTIONS.length; i++){ if (SECTIONS[i].id === href){ sec = SECTIONS[i]; break; } }
      if (!sec) return;
      e.preventDefault();
      pf.flip(sec.first - 1);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // Keyboard flipping (ignored while the lightbox is open)
    document.addEventListener("keydown", function(e){
      if (lb.classList.contains("open")) return;
      if (e.key === "ArrowRight"){ pf.flipNext(); }
      else if (e.key === "ArrowLeft"){ pf.flipPrev(); }
    });
  }

  // Load the library from CDNs in order; poll until it appears (or give up).
  var CDNS = [
    "https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js",
    "https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"
  ];
  function loadLib(i){
    if (i >= CDNS.length) return; // all CDNs failed -> stay in gallery fallback
    var s = document.createElement("script");
    s.src = CDNS[i];
    s.async = true;
    s.onerror = function(){ loadLib(i + 1); };
    document.head.appendChild(s);
  }
  var pfTries = 0;
  var pfTimer = setInterval(function(){
    if (window.St && window.St.PageFlip){
      clearInterval(pfTimer);
      try { enableFlipbook(); }
      catch (err){
        console.warn("StPageFlip init failed — keeping gallery fallback:", err);
        document.body.classList.remove("flipbook");
      }
      return;
    }
    if (++pfTries >= 40){ clearInterval(pfTimer); } // ~8s timeout -> fallback
  }, 200);
  loadLib(0);
})();
</script>
</body>
</html>
